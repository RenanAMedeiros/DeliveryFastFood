{% load static %}

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#071124">

    <title>
        {% block title %}
            Painel de Dashboards | Workspace Qore
        {% endblock %}
    </title>

    <!-- Tipografia padrão do Workspace -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome 4: mantido para ícones antigos -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Font Awesome 5: mantido para ícones atuais -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Bootstrap existente -->
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Estilos globais -->
    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}?v=1.1.0">

    <!-- Navbar -->
    <link
        rel="stylesheet"
        href="{% static 'css/style_navbar.css' %}?v=1.3.2">

    <!-- Espaçamento crítico e uniforme entre a navbar e os heroes de página. -->
    <style id="workspace-page-hero-spacing">
        :root {
            --workspace-page-hero-gap: clamp(26px, 2.1vw, 42px);
        }

        body.db-workspace-page main.db-page,
        body.metas-page main.metas-main,
        body.workspace-documentation-page main.docs-page,
        body.financeiro-page main.financeiro-main,
        body.workspace-import-page main.import-page {
            padding-top: var(--workspace-page-hero-gap) !important;
        }

        body.workspace-projetos-page .workspace-projetos-shell.ws-page-container {
            padding-top: var(--workspace-page-hero-gap) !important;
        }

        body.db-workspace-page .db-shell > .db-hero,
        body.metas-page .metas-shell > .metas-hero,
        body.workspace-documentation-page .docs-shell > .docs-hero,
        body.financeiro-page .financeiro-shell > .financeiro-hero,
        body.workspace-import-page .import-shell > .import-hero,
        body.workspace-projetos-page .workspace-projetos-shell > .ws-hero {
            margin-top: 0 !important;
        }

        body.metas-page.is-embedded main.metas-main {
            padding-top: 0 !important;
        }

        @media (max-width: 640px) and (pointer: coarse) {
            :root {
                --workspace-page-hero-gap: 20px;
            }
        }
    </style>

    <!-- Footer -->
    <link
        rel="stylesheet"
        href="{% static 'css/style_footer.css' %}?v=1.0">

    <!-- Home -->
    <link
        rel="stylesheet"
        href="{% static 'css/style_home.css' %}?v=1.0">

    <!-- Workspace UI Core — global -->
    <link
        rel="stylesheet"
        href="{% static 'workspace/core/css/workspace_core.css' %}?v=1.3.1">


    <!-- Workspace UI Core — comportamento dos componentes globais -->
    <script
        defer
        src="{% static 'workspace/core/js/workspace_components.js' %}?v=1.0.1"></script>

</head>
