{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0e14">
    <title>Entrar | {{ loja_nome }}</title>
    <link rel="icon" href="{% static 'favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/pedidos.css' %}?v=3.0.0">
</head>
<body class="loja-page">
    <main class="login-shell">
        <section class="login-card">
            <div class="brand" aria-label="{{ loja_nome }}">
                {% if loja_logo %}
                    <img src="{% static loja_logo %}" alt="{{ loja_nome }}">
                {% else %}
                    <span class="brand-mark">
                        <span class="brand-name">{{ loja_nome }}</span>
                        <span class="brand-sub">Culinária japonesa</span>
                    </span>
                {% endif %}
            </div>

            <h1>Entrar</h1>
            <p>Acesse o sistema com seu usuário e senha.</p>

            {% if error_message %}
                <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i><span>{{ error_message }}</span></div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <label class="field">
                    <span>Usuário</span>
                    <input name="usuario" id="usuario" autocomplete="username" required autofocus>
                </label>
                <label class="field">
                    <span>Senha</span>
                    <input name="senha" id="senha" type="password" autocomplete="current-password" required>
                </label>
                <div class="login-actions">
                    <a href="{% url 'esqueci_minha_senha' %}">Esqueci minha senha</a>
                    <button class="btn btn-primary" type="submit">Entrar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
